<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B4C8C">
<link rel="apple-touch-icon" href="/icons/apple-180.png?v=9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=9">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PashuAarogya — Veterinary Workspace</title>
<link rel="stylesheet" href="/css/app.css?v=9">
</head>
<body>
<header class="govbar">
  <div class="tricolor"></div>
  <div class="inner">
    <div class="emblem"><img src="/icons/logo-mark.png?v=9" alt="Pashu Aarogya" onerror="this.parentNode.textContent='🐄'"></div>
    <div>
      <h1>PashuAarogya · Veterinary Workspace</h1>
      <div class="sub">Case investigation · Treatment · Samples · Laboratory</div>
    </div>
    <div class="right">
      <span class="syncpill" id="syncPill" title="Live database sync"><span class="dot"></span><span class="lbl">…</span></span>
      <span class="rolechip" id="who"></span>
      <button class="btn-ghost" onclick="API.logout()">Logout</button>
    </div>
  </div>
</header>
<div id="netbar">⚠ Offline</div>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script src="/js/api.js?v=9"></script>
<script src="/js/i18n.js?v=9"></script>
<script src="/js/vet.js?v=9"></script>
</body>
</html>
