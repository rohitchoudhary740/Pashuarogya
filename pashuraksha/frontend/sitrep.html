<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=9">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>पशुआरोग्य — Situation Report</title>
<link rel="stylesheet" href="/css/app.css?v=9">
<style>
body{background:#fff}
.doc{max-width:900px;margin:0 auto;padding:22px 26px 60px;font-size:13.5px}
.hd{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--navy);padding-bottom:12px}
.hd .em{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--saffron);display:flex;
  align-items:center;justify-content:center;font-size:28px}
.hd h1{font-family:var(--f-d);font-size:22px;margin:0;color:var(--navy)}
.hd .sub{font-size:12px;color:var(--muted)}
.stamp{margin-left:auto;text-align:right;font-family:var(--f-m);font-size:11px;color:var(--muted)}
h2{font-family:var(--f-d);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);
  margin:22px 0 8px;display:flex;gap:8px;align-items:center}
h2::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--saffron)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.kp div{border:1px solid var(--hair);border-radius:10px;padding:10px 12px}
.kp b{font-family:var(--f-d);font-size:24px;display:block;line-height:1}
.kp span{font-size:11px;color:var(--muted)}
table{font-size:12.5px}
.box{border:1.5px solid var(--saffron);background:#FFF9F5;border-radius:10px;padding:12px 14px;margin-top:8px}
.sig{margin-top:36px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sig div{border-top:1px solid var(--ink);padding-top:6px;width:220px}
@media print{.noprint{display:none}.doc{padding:0}}
</style>
</head>
<body>
<div class="doc">
  <div class="noprint" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <a href="/gov.html" class="btn sm outline">‹ Back to portal</a>
    <button class="btn sm saffron" onclick="window.print()">🖨 Print / Save as PDF</button>
  </div>
  <div class="hd"><div class="em"><img src="/icons/logo-mark.png?v=9" alt="Pashu Aarogya" onerror="this.parentNode.textContent='🐄'"></div>
    <div><h1>Animal-Health Situation Report (SITREP)</h1>
      <div class="sub">पशुसंवर्धन विभाग, महाराष्ट्र शासन · Dept. of Animal Husbandry &amp; Dairying · Auto-generated by पशुआरोग्य</div></div>
    <div class="stamp" id="stamp"></div></div>
  <div id="body"><div class="muted" style="padding:20px">Generating…</div></div>
</div>
<script src="/js/api.js?v=9"></script>
<script>
API.requireRole('block', 'district', 'state');
(async () => {
  const r = await API.get('/api/sitrep');
  const s = r.summary, f = r.forecast;
  document.getElementById('stamp').innerHTML = `Generated ${fmtDT(r.generated_at)}<br>by ${esc(r.by)} (${esc(r.role)})<br>Ref: SITREP-${r.generated_at.slice(0,10).replace(/-/g,'')}`;
  document.getElementById('body').innerHTML = `
    <div class="kp">
      <div><b>${s.active_outbreaks}</b><span>Active detected clusters</span></div>
      <div><b>${s.cases_7d}</b><span>Case reports · 7 days</span></div>
      <div><b>${s.deaths_7d}</b><span>Reported deaths · 7 days</span></div>
      <div><b>${s.high_risk_villages}</b><span>High-risk villages</span></div>
      <div><b>${Math.round(s.vaccination_coverage*100)}%</b><span>Vaccination coverage</span></div>
      <div><b>${s.pending_lab}</b><span>Samples in lab pipeline</span></div>
      <div><b>${r.claims.pending}</b><span>Compensation claims pending</span></div>
      <div><b>₹${(r.claims.amount_approved||0).toLocaleString('en-IN')}</b><span>Approved compensation</span></div>
    </div>

    <h2>1. Detected outbreak clusters (space-time scan, p&lt;0.05)</h2>
    ${r.clusters.length ? `<table><thead><tr><th>#</th><th>Suspected</th><th>Centre</th><th>Obs / Exp (7d)</th><th>p-value</th><th>Radius</th><th>Zoonotic</th></tr></thead>
      <tbody>${r.clusters.map(c => `<tr><td>${c.id}</td><td><b>${esc(c.suspected)}</b></td><td>${esc(c.center)}</td>
        <td>${c.cases_7d} / ${c.expected}</td><td>${c.p_value < 0.001 ? '<0.001' : c.p_value}</td><td>${c.radius_km} km</td>
        <td>${c.zoonotic ? '<b style="color:#7C3AED">YES — IDSP notified</b>' : 'No'}</td></tr>`).join('')}</tbody></table>`
      : '<div class="muted">No significant clusters.</div>'}

    <h2>2. Seven-day outlook &amp; recommended intervention</h2>
    <div class="box">Model projection (SEIR-lite on village graph): <b>${f.baseline_cases}</b> new cases in 7 days if no action.
      With ring vaccination within <b>${f.ring_km} km</b> of each cluster (${f.ring_villages} villages,
      ~${f.doses_needed.toLocaleString('en-IN')} doses): <b>${f.scenario_cases}</b> cases —
      <b style="color:var(--green)">${f.prevented} cases prevented (${f.prevented_pct}%)</b>.
      Recommendation: authorise ring vaccination and movement control in listed zones today.</div>

    <h2>3. High-risk villages (explainable risk score ≥ 60)</h2>
    ${r.high_risk.length ? `<table><thead><tr><th>Village</th><th>Score</th><th>Top reasons</th></tr></thead><tbody>
      ${r.high_risk.map(u => `<tr><td><b>${esc(u.name)}</b></td><td>${u.score}</td><td>${(u.reasons||[]).slice(0,2).map(esc).join('; ')}</td></tr>`).join('')}</tbody></table>`
      : '<div class="muted">None.</div>'}

    <h2>4. Open response actions</h2>
    ${r.tasks_open.length ? `<table><thead><tr><th>Action</th><th>Owner</th><th>Village</th><th>Status</th></tr></thead><tbody>
      ${r.tasks_open.map(t => `<tr><td>${esc(t.title)}</td><td>${esc(t.assigned_role)}</td><td>${esc(t.village||'')}</td><td>${esc(t.status)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="muted">All actions closed.</div>'}

    <h2>5. Vaccination coverage by block (LHDCP)</h2>
    <table><thead><tr><th>Block</th><th>District</th><th>Animals</th><th>Vaccinated</th><th>Coverage</th></tr></thead><tbody>
      ${r.vaccination.map(v => `<tr><td>${esc(v.block)}</td><td>${esc(v.district)}</td><td>${v.animals}</td><td>${v.vaccinated}</td>
        <td style="${v.coverage < .5 ? 'color:var(--red);font-weight:700' : ''}">${Math.round(v.coverage*100)}%</td></tr>`).join('')}</tbody></table>

    <h2>6. Advisories issued</h2>
    ${r.alerts.map(a => `<div style="padding:5px 0;border-bottom:1px solid var(--surface-2)"><b>${esc(a.title)}</b>
      <span class="muted" style="font-size:11px"> · → ${esc(a.target_role)} · ${fmtDT(a.created_at)}</span></div>`).join('')}

    <div class="sig"><div>District Animal Husbandry Officer</div><div>Collector / CEO Zilla Parishad</div></div>
    <p class="muted" style="font-size:10.5px;margin-top:22px">Surveillance data in this prototype is a calibrated simulation.
      Risk scores and forecasts are decision support; clinical diagnosis rests with registered veterinarians.</p>`;
})();
</script>
</body>
</html>
