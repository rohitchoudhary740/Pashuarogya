# =============================================================================
#  SCHEDULED ANIMAL DISEASES OF INDIA — reference list, not the triage KB
# =============================================================================
#  Source: THE SCHEDULE to the Prevention and Control of Infectious and
#  Contagious Diseases in Animals Act, 2009 (Act 27 of 2009) — the statutory
#  list of diseases a keeper or veterinarian is legally required to report.
#
#  Verified against two independent government-linked transcriptions, which
#  agree exactly: 83 diseases in 7 categories.
#    - Directorate of AH & Veterinary, Govt. of Assam
#      https://veterinary.assam.gov.in/information-services/scheduled-animal-diseases
#    - Act text: https://www.indiacode.nic.in/handle/123456789/2101
#
#  WHY THIS FILE EXISTS
#  --------------------
#  The "108 diseases" figure quoted for Maharashtra's 1962 Pashudhan Sanjivani
#  service is described on the DAHD Maharashtra scheme page, but that list is
#  NOT published anywhere public — it lives inside the call-centre software. Do
#  not quote the number as if we had seen it. This statutory list of 83 is the
#  defensible public baseline to measure our own coverage against.
#
#  HOW IT IS USED
#  --------------
#  Reference only — `diseases.yaml` stays the triage knowledge base, because
#  triage needs sign weights, seasonality and farmer advisories per disease,
#  which a legal list does not carry. Use this file to decide what to add next
#  and to answer "how many diseases do you cover, and out of what?".
#
#  covered: true  -> already in rules/diseases.yaml with full triage rules
#  priority: high -> endemic in India and worth adding next
# =============================================================================

meta:
  source: "Prevention and Control of Infectious and Contagious Diseases in Animals Act, 2009 — Schedule"
  total: 83
  covered_now: 13          # of the 83 scheduled diseases
  also_covered_unscheduled: 4   # BQ, mastitis, mange, enterotoxaemia (see below)

