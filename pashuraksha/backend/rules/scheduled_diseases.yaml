# =============================================================================
#  COVERED BY US BUT *NOT* SCHEDULED
#  These are production diseases, not notifiable ones. They are in our triage KB
#  because they are what a farmer actually rings about — a surveillance system a
#  farmer will use has to answer the everyday complaint, not only the legal one.
# =============================================================================
not_scheduled_but_covered:
  - { name: "Black Quarter (फऱ्या)",  key: bq,       note: "clostridial, vaccine-preventable, common in Maharashtra" }
  - { name: "Mastitis",                key: mastitis, note: "the single biggest milk-loss complaint" }
  - { name: "Mange / skin infestation", key: mange,   note: "very common, easily confused with LSD early on" }
  - { name: "Enterotoxaemia",          key: et,       note: "sudden death in goats and sheep" }
